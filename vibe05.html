er:1px solid #dfeae5;border-radius:12px;padding:19px;font-size:14px;max-height:440px;overflow:auto}.callout{background:#f1f7f4;border-left:4px solid #4b9b87;padding:14px 18px;border-radius:9px;margin:14px 0}.warning{background:#fff7e9;border-left-color:#c38b38}.checkline{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #eee}.checkline input{width:19px;height:19px;accent-color:#276e65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini{border:1px solid #e2e8e4;border-radius:12px;padding:15px;background:#fcfdfc}.mini strong{display:block;color:#245f59}.note{background:#fff8e9;border:1px solid #eed9a9;padding:17px;border-radius:12px;margin-top:18px}.stepnum{display:inline-block;background:#e5f1ed;border-radius:20px;padding:3px 10px;color:#1d655d;font-size:12px;font-weight:800}.footer{margin-top:22px;color:#7a8588;font-size:12px}.choice{width:100%;padding:10px;background:#fff;border:1px solid #dbe4e0;border-radius:10px}.field{margin:12px 0}.field label{display:block;font-weight:750;margin-bottom:5px}.field textarea{width:100%;border:1px solid #dbe4e0;border-radius:10px;padding:10px;min-height:60px}.hidden{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:5px}.navbtn{min-width:145px;font-size:13px}.wrap{padding:12px}.hero{padding:22px}.card{padding:18px}.grid{grid-template-columns:1fr}.top{padding:10px 15px}}@media print{.top,.side,.actions{display:none!important}.layout{display:block}.panel{display:block!important;break-before:page}.prompt{max-height:none}.card{box-shadow:none}}</style></head><body><header class="top"><div class="brand">우리 모임 웹앱 · 수강생용 실습 교안</div><div class="muted">제미나이 캔버스 실습</div></header><main class="wrap"><div class="hero"><div style="font-size:13px;opacity:.8">VIBE CODING WORKSHOP</div><h1>아이디어에서 실행되는 웹앱까지</h1><p>성향 테스트 제작 → 프롬프트 이해 → 나만의 웹앱 기획</p></div><div class="layout"><nav class="side" id="nav" aria-label="교안 목차"></nav><div class="content" id="panels"></div></div><div class="footer">학습용 오프라인 HTML 교안 · 체크 상태는 현재 브라우저에 저장됩니다.</div></main><div id="toast" style="display:none;position:fixed;bottom:22px;right:22px;background:#253f46;color:white;padding:12px 20px;border-radius:10px;z-index:20"></div><script>const DATA=[{"title": "1단계. 웹서비스 기본 화면 만들기", "desc": "기본 화면과 메뉴 4개", "prompt": "1단계. 웹서비스 기본 화면 만들기\n학습 개념: 웹앱의 구조, 메뉴, 버튼, HTML과 CSS\n\n목표: 성향 테스트 화면과 4개 메뉴를 갖춘 기본 웹서비스 제작\n\n제미나이 캔버스에서 실행할 웹앱을 만들어 주세요.\n\n프로젝트 이름: 우리 모임 운영 서비스\n\n성인 모임 참여자가 사용할 수 있는 깔끔하고 직관적인 웹서비스를 만들고 싶습니다.\n\n1. 제작 환경\nHTML, CSS, JavaScript를 사용하는 웹앱으로 만들어 주세요.\n\n모든 코드는 하나의 HTML 파일 안에 작성해 주세요.\n\n외부 라이브러리, 데이터베이스, 로그인, API 연결은 사용하지 마세요.\n\n한국어로 제작하고 PC와 스마트폰 화면에 대응해 주세요.\n\n제미나이 캔버스에서 바로 미리 볼 수 있도록 만들어 주세요.\n\n2. 전체 메뉴\n상단에 다음 4개 메뉴를 순서대로 배치해 주세요.\n\n성향 테스트\n\n모임 소개\n\n회비 정산\n\n외출 지수\n\n현재는 '성향 테스트' 메뉴만 활성화합니다.\n\n나머지 메뉴를 클릭하면 각각 다음 안내를 표시해 주세요.\n\n모임 소개: 2차시에 만나요! 준비 중인 기능입니다.\n\n회비 정산: 3차시에 만나요! 준비 중인 기능입니다.\n\n외출 지수: 4차시에 만나요! 준비 중인 기능입니다.\n\n준비 중 메뉴를 눌러도 웹앱이 멈추거나 다른 사이트로 이동하지 않게 해 주세요.\n\n3. 성향 테스트 시작 화면\n제목: 나는 어떤 모임 유형일까?\n\n설명: 5가지 질문으로 나에게 어울리는 모임 역할을 알아보세요.\n\n'테스트 시작하기' 버튼\n\n질문 수: 총 5개\n\n결과 유형: 분위기 메이커, 기록 담당, 길잡이\n\n아직 질문, 점수 계산, 결과 화면은 구현하지 마세요.\n\n시작 버튼을 누르면 '다음 단계에서 질문 기능을 추가할 예정입니다.'라는 안내를 표시해 주세요.\n\n4. 디자인\n성인 대상의 깔끔하고 세련된 디자인\n\n흰색 또는 밝은 아이보리 배경\n\n차분한 포인트 색상\n\n읽기 쉬운 큰 글씨\n\n둥근 카드와 버튼\n\n모바일에서도 메뉴와 버튼이 잘 보이도록 구성\n\n5. 이번 단계의 완료 조건\n메뉴 4개가 모두 보일 것\n\n성향 테스트 시작 화면이 보일 것\n\n시작 버튼을 누르면 안내가 나올 것\n\n준비 중 메뉴 3개를 누르면 각각 안내가 나올 것\n\n이번 단계에서는 요청한 기본 화면만 구현해 주세요. 다음 단계에서 질문 기능을 추가하겠습니다."}, {"title": "2단계. 질문 5개와 선택지 만들기", "desc": "질문 5개와 보기 15개", "prompt": "2단계. 질문 5개와 선택지 만들기\n학습 개념: 사용자 입력, 선택지, 배열, 화면 전환\n\n목표: 5개 질문을 하나씩 표시하고 이전 답변을 수정할 수 있도록 구현\n\n현재 제미나이 캔버스에서 제작한 '우리 모임 운영 서비스'를 이어서 수정해 주세요.\n\n기존 메뉴 4개와 전체 디자인을 유지하면서 성향 테스트의 질문 기능만 추가해 주세요.\n\n1. 질문 구성\n질문은 총 5개이고, 각 질문에는 보기 3개가 있습니다.\n\n다음 질문과 보기를 문구 그대로 사용해 주세요.\n\n질문 1. 모임에서 처음 만난 사람이 있다면?\n\n먼저 다가가 반갑게 대화를 시작한다.\n\n이름과 특징을 기억하고 기록해 둔다.\n\n편하게 어울릴 수 있도록 자리를 안내한다.\n\n질문 2. 모임 여행을 준비한다면?\n\n모두가 즐길 수 있는 재미있는 활동을 생각한다.\n\n준비물과 필요한 정보를 목록으로 정리한다.\n\n이동 경로와 일정을 계획한다.\n\n질문 3. 모임 활동이 끝난 후에는?\n\n즐거웠던 이야기를 나누고 다음 만남을 제안한다.\n\n사진과 활동 내용을 정리해 공유한다.\n\n다음 모임 날짜와 장소를 조율한다.\n\n질문 4. 모임에서 예상하지 못한 문제가 생긴다면?\n\n사람들과 대화하며 분위기를 부드럽게 만든다.\n\n현재 상황과 필요한 정보를 정리한다.\n\n해결 순서를 정하고 역할을 나눈다.\n\n질문 5. 새로운 모임을 만든다면?\n\n새로운 사람들을 초대하고 참여를 독려한다.\n\n활동 기록과 공지 내용을 체계적으로 관리한다.\n\n모임의 목표와 운영 계획을 세운다.\n\n2. 질문 화면 기능\n'테스트 시작하기'를 누르면 첫 번째 질문이 나타나게 해 주세요.\n\n질문은 한 화면에 하나씩 표시해 주세요.\n\n보기 중 하나만 선택할 수 있게 해 주세요.\n\n답변을 선택하면 '다음 질문' 버튼으로 이동할 수 있게 해 주세요.\n\n답변을 선택하지 않았다면 다음 질문으로 이동할 수 없도록 해 주세요.\n\n현재 진행 상태를 '1 / 5'처럼 표시해 주세요.\n\n진행률 막대도 추가해 주세요.\n\n'이전 질문' 버튼으로 돌아갈 수 있게 해 주세요.\n\n이전 질문으로 돌아가면 기존 선택이 그대로 표시되어야 합니다.\n\n이전 답변을 다른 보기로 변경할 수 있어야 합니다.\n\n첫 번째 질문에서는 '이전 질문' 버튼을 숨겨 주세요.\n\n3. 답변 저장 방식\n질문별 선택 결과를 JavaScript 배열에 저장해 주세요.\n\n같은 질문에 답변을 다시 선택하면 기존 답변을 교체해 주세요.\n\n아직 점수 계산 기능은 추가하지 마세요.\n\n마지막 질문에서 '답변 확인하기' 버튼을 누르면 선택한 보기 번호 5개를 보여 주는 임시 확인 화면을 표시해 주세요.\n\n임시 확인 화면에서 '답변 수정하기'를 누르면 마지막 질문으로 돌아갈 수 있게 해 주세요.\n\n4. 기존 기능 보호\n상단 메뉴 4개를 유지해 주세요.\n\n준비 중인 메뉴 3개는 기존 안내 문구를 유지해 주세요.\n\n기존 디자인과 레이아웃을 가능한 한 유지해 주세요.\n\n이번 단계에서 요청하지 않은 기능은 추가하지 마세요.\n\n수정 후 질문 이동, 이전 답변 유지, 답변 변경, 마지막 확인 화면이 정상 작동하는지 점검해 주세요."}, {"title": "3단계. 점수 계산과 임시 점수표 만들기", "desc": "점수 재계산과 동점 검증", "prompt": "3단계. 점수 계산과 임시 점수표 만들기\n학습 개념: 변수, 배열, 반복, 조건문, 점수 계산\n\n목표: 응답에 따라 점수를 정확히 계산하고 동점까지 처리\n\n현재 제작 중인 '우리 모임 운영 서비스'에 성향 테스트 점수 계산 기능을 추가해 주세요.\n\n기존 질문 5개, 보기 15개, 답변 수정 기능, 메뉴 4개와 디자인은 유지해 주세요.\n\n1. 점수 계산 규칙\n모든 질문에서 보기 번호에 따라 다음 점수를 부여합니다.\n\n1번 보기: 분위기 메이커 +1점\n\n2번 보기: 기록 담당 +1점\n\n3번 보기: 길잡이 +1점\n\n각 질문에서 선택한 보기 하나에만 1점을 부여합니다.\n\n질문 5개를 모두 완료하면 세 유형의 점수 합계는 반드시 5점이어야 합니다.\n\n2. 점수 계산 방식\n질문별 답변을 저장한 배열을 기준으로 점수를 계산해 주세요.\n\n마지막 질문을 완료했을 때 저장된 답변 5개를 처음부터 읽어서 점수를 계산해 주세요.\n\n점수를 계산하기 전에 세 유형의 점수를 모두 0으로 초기화해 주세요.\n\n이전 답변을 수정하면 수정된 답변을 기준으로 점수를 새로 계산해 주세요.\n\n답변을 선택할 때마다 기존 점수에 누적하는 방식은 사용하지 마세요.\n\n같은 답변을 여러 번 선택하거나 이전 질문으로 돌아가더라도 점수가 중복되지 않게 해 주세요.\n\ 치해야 합니다.\n\n5. 다시 시작하기\n'다시 시작하기'를 누르면 첫 번째 질문으로 돌아가게 해 주세요.\n\n이전에 선택한 답변을 모두 초기화해 주세요.\n\n점수도 모두 0으로 초기화해 주세요.\n\n다시 검사하면 새로운 답변에 따라 결과가 달라져야 합니다.\n\n6. 답변 수정\n결과 화면에도 '답변 수정하기' 버튼을 제공해 주세요.\n\n버튼을 누르면 마지막 질문으로 돌아갑니다.\n\n기존 선택을 유지해 주세요.\n\n답변을 수정한 후 결과를 다시 확인하면 수정된 점수와 유형을 표시해 주세요.\n\n7. 기존 기능 보호\n질문 5개와 보기 15개를 유지해 주세요.\n\n보기별 점수 규칙을 변경하지 마세요.\n\n동점 처리 규칙을 변경하지 마세요.\n\n상단 메뉴 4개와 준비 중 안내를 유지해 주세요.\n\n전체 디자인을 가능한 한 유지해 주세요.\n\n정식 결과 화면을 추가한 뒤 점수 계산과 기존 기능이 정상 작동하는지 점검해 주세요."}, {"title": "5단계. 디자인 개선, 오류 검증, 저장", "desc": "디자인 정리 및 저장", "prompt": "5단계. 디자인 개선, 오류 검증, 저장\n학습 개념: 사용자 경험, 반응형 디자인, 디버깅, 파일 저장\n\n목표: 정상 작동하는 1차시 최종 HTML 완성\n\n현재 제미나이 캔버스에서 완성한 '우리 모임 운영 서비스'를 최종 점검하고 디자인을 소폭 개선해 주세요.\n\n중요: 이번 단계에서는 새로운 기능을 추가하거나 기존 기능을 다시 설계하지 마세요.\n\n1. 디자인 개선\n현재의 전체적인 색상과 디자인 방향을 유지해 주세요.\n\n제목과 본문 글씨를 읽기 쉽게 정리해 주세요.\n\n버튼 크기와 간격을 통일해 주세요.\n\n질문과 결과 화면의 카드 디자인을 통일해 주세요.\n\n스마트폰에서도 메뉴와 버튼이 겹치지 않게 해 주세요.\n\n지나친 애니메이션이나 복잡한 효과는 추가하지 마세요.\n\n2. 기존 기능 점검\n다음 기능이 모두 유지되는지 확인해 주세요.\n\n상단 메뉴 4개 표시\n\n성향 테스트 시작하기\n\n질문 5개 표시\n\n각 질문의 보기 3개 표시\n\n이전 질문으로 돌아가기\n\n기존 답변 수정하기\n\n점수 계산\n\n동점 결과 표시\n\n유형별 결과 설명\n\n점수표 표시\n\n다시 시작하기\n\n준비 중 메뉴 안내\n\n3. 계산 규칙 유지\n1번 보기: 분위기 메이커 +1점\n\n2번 보기: 기록 담당 +1점\n\n3번 보기: 길잡이 +1점\n\n총점은 반드시 5점\n\n동점이면 공동 결과 표시\n\n답변 수정 시 전체 점수 재계산\n\n4. 오류 수정 원칙\n실제 오류가 확인된 부분만 최소한으로 수정해 주세요.\n\n기존에 정상 작동하는 기능은 변경하지 마세요.\n\n질문 문구와 보기 순서를 바꾸지 마세요.\n\n기존 결과 설명 문구를 유지해 주세요.\n\n새로운 외부 라이브러리, API, 데이터베이스를 추가하지 마세요.\n\n5. 최종 저장\n완성된 웹앱을 하나의 HTML 파일로 유지해 주세요.\n\n파일 이름은 다음과 같이 사용할 예정입니다.\n\n우리모임_1차시_완성.html\n\n다음 차시에는 이 파일을 다시 불러와 '모임 소개' 기능을 추가할 예정이므로, 메뉴 구조와 기존 성향 테스트 기능이 유지되도록 해 주세요.\n\n최종 코드가 준비되면 캔버스에서 미리 보기로 확인할 수 있게 해 주세요.\n\n실제로 실행하지 않은 테스트는 실행했다고 주장하지 말고, 사용자가 직접 확인해야 하는 항목을 구분해 알려 주세요."}, {"title": "메타프롬프트로 앱 기획하기", "desc": "새 대화에서 AI에게 기획 질문을 하나씩 받습니다.", "prompt": "나는 코딩을 모르는 초보자입니다. 제미나이 캔버스로 나만의 웹앱을 만들고 싶지만 아이디어를 구체적으로 설명하는 방법을 잘 모릅니다.\n\n당신은 웹앱 기획 전문가입니다.\n1. 내가 만들고 싶은 앱이 무엇인지 먼저 물어봐 주세요.\n2. 앱의 사용 대상, 목적, 필요한 기능, 디자인을 결정할 수 있도록 쉬운 질문을 하나씩 해 주세요.\n3. 내가 답하 e=DATA[i].prompt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('복사 완료');});}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800);}function mark(i,checked){localStorage.setItem('lesson-'+(INSTRUCTOR?'t':'s')+'-'+i,checked?'1':'0');updateProgress();}function updateProgress(){let n=0;document.querySelectorAll('[data-check]').forEach(x=>{if(x.checked)n++});document.getElementById('progress').textContent=n+' / '+document.querySelectorAll('[data-check]').length+' 완료';}function build(){const nav=document.getElementById('nav'),out=document.getElementById('panels');const tabs=[['intro','수업 안내'],['theory','핵심 이론'],...DATA.map((x,i)=>['s'+i,(i<5?i+1+'단계':'확장 '+(i-4))+'. '+x.title.replace(/^\d단계\. /,'')]),['custom','나만의 앱 기획'],['finish','저장과 점검']];nav.innerHTML=tabs.map(([id,name])=>`<button class="navbtn" data-id="${id}" onclick="show('${id}')">${esc(name)}</button>`).join('');let intro=`<section class="panel" id="p-intro"><div class="card"><div class="eyebrow">LEARNING PATH</div><h2>오늘 만들고 배우는 것</h2><p>제미나이 캔버스에서 <b>우리 모임 운영 서비스</b>를 단계별로 제작하고, 스스로 다른 웹앱을 기획하는 방법까지 익힙니다.</p><div class="grid"><div class="mini"><strong>공통 제작 1~5단계</strong>성향 테스트, 점수 계산, 결과 화면, HTML 저장</div><div class="mini"><strong>확장 4개 실습</strong>메타프롬프트, 역프롬프트, 글꼴 변경, 오류 해결</div><div class="mini"><strong>스스로 기획</strong>선택형 질문으로 앱 요구사항과 제작 프롬프트 만들기</div><div class="mini"><strong>결과물</strong>브라우저에서 실행되는 HTML 파일 한 개</div></div><div class="callout">이미 1~5단계를 완료했다면 다시 만들 필요 없이 확장 실습부터 시작하세요. 새로운 아이디어 기획은 별도의 제미나이 대화에서 진행합니다.</div></div>${INSTRUCTOR?'<div class="note"><b>강사용 진행 안내</b><p>수강생 수준에 따라 이미 완료한 1~5단계는 빠르게 복습하고, 메타프롬프팅과 자율 기획에 집중하세요. 각 실습의 강사 메모를 확인할 수 있습니다.</p></div>':''}</section>`;let theory=`<section class="panel" id="p-theory"><div class="card"><div class="eyebrow">CONCEPT</div><h2>웹앱과 바이브코딩 이해하기</h2><div class="grid"><div class="mini"><strong>바이브코딩</strong>원하는 기능을 자연어로 설명하고 AI와 함께 코드를 만들고 수정하는 방식. 사람이 목표와 검증을 담당합니다.</div><div class="mini"><strong>HTML</strong>웹페이지의 내용과 구조. 제목, 메뉴, 질문, 버튼을 만듭니다.</div><div class="mini"><strong>CSS</strong>글꼴, 색상, 카드, 여백, 모바일 배치를 꾸밉니다.</div><div class="mini"><strong>JavaScript</strong>버튼 동작, 답변 저장, 점수 계산, 결과 표시를 담당합니다.</div><div class="mini"><strong>메타프롬프트</strong>AI에게 좋은 제작 프롬프트를 만들거나 개선하도록 요청합니다.</div><div class="mini"><strong>역프롬프트</strong>참고 화면이나 결과물을 분석해 제작 요구사항을 거꾸로 도출합니다.</div></div><h3>입력 → 처리 → 출력</h3><p>보기 선택(입력) → 답변 배열을 읽고 점수 계산(처리) → 성향 결과 카드 표시(출력)</p><h3>좋은 수정 요청의 4가지</h3><p>① 현재 상태 ② 변경할 부분 ③ 유지할 부분 ④ 확인할 기준을 함께 전달합니다.</p><div class="callout warning">글꼴 이름을 적는 것만으로 모든 기기에서 표시되지는 않습니다. 외부 웹폰트는 인터넷이 필요할 수 있고, 글꼴 사용 허가도 확인해야 합니다.</div></div>${INSTRUCTOR?'<div class="note"><b>강사용 설명 예시</b><p>“HTML은 뼈대, CSS는 옷, 자바스크립트는 움직임입니다. AI가 코드를 작성하더라도 정답과 오류는 사람이 확인해야 합니다.” 학생에게 결과 화면을 보여주고 어떤 부분이 세 요소에 해당하는지 질문하세요.</p></div>':''}</section>`;let pages=DATA.map((d,i)=>`<section class="panel" id="p-s${i}"><div class="card"><span class="stepnum">${i<5?'공통 실습 '+(i+1)+'/5':'확장 실습 '+(i-4)+'/4'}</span><h2>${esc(d.title)}</h2><p class="muted">${esc(d.desc)}</p><div class="actions"><button class="btn primary" onclick="copyPrompt(${i})">📋 프롬프트 복사</button><button class="btn" onclick="show('${i<8?'s'+(i+1):'custom'}')">다음 단계 보기</button></div><div class="prompt">${esc(d.prompt)}</div><label class="checkline"><input type="checkbox" data-check="${i}" onchange="mark(${i},this.checked)"> 이 단계 직접 실행하고 확인함</label>${INSTRUCTOR?`<div class="note"><b>강사용 시연 및 점검</b><p>${esc(["처음에는 4개 메뉴 중 성향 테스트만 동작하도록 설계한 이유를 설명합니다. 완성 기능과 준비 중 기능을 구분하면 수정 범위가 작아집니다.", "질문을 한 화면에 하나씩 표시하는 구조와 배열에 답을 저장하는 개념을 시연합니다. 이전 질문으로 돌아가 답을 바꿔 봅니다.", "점수는 선택 순간 누적하지 않고 답변 배열을 처음부터 읽어 재계산해야 합니다. 1-2-1-2-3은 2,2,1 공동 결과입니다. 첫 답을 1에서 2로 바꿨을 때 총점이 5인지 확인합니다.", "결과 유형 3개를 각각 확인하고, 동점이면 두 카드가 함께 나오는지 시연합니다. 다시 시작 후 기존 답이 초기화되는지 확인합니다.", "파일을 내려받아 확장자 .html을 유지한 채 이름을 바꾸고 브라우저에서 열어 봅니다. 실제 클릭 테스트 없이 검증 완료라고 단정하지 않습니다.", "메타프롬프트는 AI에게 프롬프트 자체를 만들게 하는 요청입니다. 수강생이 한 문장 아이디어를 말하면 AI가 사용자, 기능, 디자인을 질문하게 시연합니다.", "역프롬프팅은 결과물에서 요구사항을 역으로 추출하는 접근입니다. 스크린샷에 보이지 않는 동작을 지어내지 않도록 강조합니다.", "웹폰트는 인터넷이 필요할 수 있습니다. CSS 분리는 이번 수업 필수가 아닙니다. HTML 한 파일로 유지합니다.", "문제 재현 → 기대 동작 → 변경 범위 제한 → 재검증 순서로 설명합니다. 기존 기능을 보존하는 것이 핵심입니다."][i])}</p></div>`:''}</div></section>`).join('');let custom=`<section class="panel" id="p-custom"><div class="card"><div class="eyebrow">MAKE YOUR OWN</div><h2>선택해서 나만의 웹앱 기획하기</h2><p>아래 항목을 고르면 제작 요청문이 자동으로 완성됩니다. 직접 적고 싶은 내용은 추가 입력할 수 있습니다.</p><div class="grid"><div class="field"><label>서비스 주제</label><select class="choice" id="kind" onchange="makeCustom()"><option>오늘의 컨디션 체크</option><option>취미 모임 일정 도우미</option><option>간단한 가계부</option><option>나만의 독서 기록장</option><option>여행 준비 체크리스트</option></select></div><div class="field"><label>사용 대상</label><select class="choice" id="audience" onchange="makeCustom()"><option>직장인</option><option>대학생</option><option>성인 누구나</option><option>동호회 회원</option></select></div><div class="field"><label>디자인</label><select class="choice" id="design" onchange="makeCustom()"><option>차분한 베이지와 아이보리</option><option>시원한 파랑과 흰색</option><option>산뜻한 초록과 크림색</option><option>세련된 차콜과 밝은 회색</option></select></div><div class="field"><label>중요 기능</label><select class="choice" id="feature" onchange="makeCustom()"><option>질문 5개와 선택지 3개</option><option>목록 추가와 삭제</option><option>일정 입력과 확인</option><option>기록 작성과 목록 보기</option></select></div></div><div class="field"><label>내가 추가하고 싶은 내용 (선택)</label><textarea id="detail" oninput="makeCustom()" placeholder="예: 큰 글씨, 밝은 느낌, 첫 화면에 소개 문구"></textarea></div><div class="actions"><button class="btn primary" onclick="copyCustom()">📋 내 제작 프롬프트 복사</button></div><div class="prompt" id="customText"></div><div class="callout">완성된 요청문을 제미나이 새 대화에 붙여넣으세요. 처음에는 기본 화면만 제작하고, 동작 확인 후 다음 기능을 요청합니다.</div>${INSTRUCTOR?'<div class="note"><b>강사용 지도 포인트</b><p>선택만으로도 기획할 수 있게 하되, 자유 입력을 통해 자신의 요구를 말로 표현하게 합니다. 주제에 따라 기능이 달라지므로 공통 성향 테스트 점수 규칙을 무리하게 적용하지 않습니다.</p></div>':''}</div></section>`;let finish=`<section class="panel" id="p-finish"><div class="card"><div class="eyebrow">FINAL CHECK</div><h2>HTML 저장과 정상 작동 점검</h2><p>제미나이 캔버스에서 HTML 파일을 다운로드하고 <b>우리모임_1차시_완성.html</b>로 이름을 바꾼 다음 브라우저에서 다시 열어 보세요. 파일 확장자 .html을 유지해야 합니다.</p><p id="progress">0 / 9 완료</p>${CHECKS.map((s,i)=>`<label class="checkline"><input type="checkbox" data-check="f${i}" onchange="mark('f${i}',this.checked)">${esc(s)}</label>`).join('')}<div class="callout warning">AI가 “점검했다”고 답해도 실제 브라우저 클릭 검증은 별개입니다. 특히 총점 5점, 동점 결과, 답변 수정, 초기화를 직접 확인하세요.</div><h3>다음 차시 준비</h3><p>현재 파일을 보관하세요. 다음 차시에는 같은 HTML을 불러와 <b>모임 소개</b> 메뉴를 추가하고 기존 성향 테스트는 그대로 유지합니다.</p>${INSTRUCTOR?'<div class="note"><b>강사용 정답</b><p>1-1-1-1-1 → 5/0/0, 2-2-2-2-2 → 0/5/0, 3-3-3-3-3 → 0/0/5, 1-2-1-2-3 → 2/2/1(공동), 1-2-3-1-3 → 2/1/2(공동). 답변 수정 후 합계가 6점이면 오류입니다.</p></div>':''}</div></section>`;out.innerHTML=intro+theory+pages+custom+finish;document.querySelectorAll('[data-check]').forEach(x=>{x.checked=localStorage.getItem('lesson-'+(INSTRUCTOR?'t':'s')+'-'+x.dataset.check)==='1'});makeCustom();updateProgress();show('intro');}function makeCustom(){const g=id=>document.getElementById(id).value;const s=`제미나이 캔버스에서 '${g('kind')}' 웹앱을 만들고 싶습니다.\n사용 대상: ${g('audience')}\n디자인: ${g('design')}\n우선 구현할 기능: ${g('feature')}\n추가 요청: ${g('detail')||'없음'}\n\nHTML, CSS, JavaScript를 하나의 HTML 파일에 작성하고 스마트폰에도 대응해 주세요. 외부 API, 데이터베이스, 로그인은 사용하지 마세요. 먼저 기본 화면과 핵심 입력 기능만 구현해 주세요. 점수 계산이나 저장 등 후속 기능은 제가 확인한 다음 단계별로 요청하겠습니다. 기존에 정상 작동하는 기능은 유지해 주세요.`;document.getElementById('customText').textContent=s;}function copyCustom(){navigator.clipboard.writeText(document.getElementById('customText').textContent).then(()=>toast('내 프롬프트 복사 완료'));}document.addEventListener('DOMContentLoaded',build);</script></body></html>
